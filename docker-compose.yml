version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - crawler_network
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - crawler_network
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler_password
      POSTGRES_DB: crawler_db
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - crawler_network
    volumes:
      - pg-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - crawler_network

  grafana:
    image: grafana/grafana:10.1.2
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - crawler_network

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    container_name: agent-service
    ports:
      - "8090:8090"
    environment:
      EXECUTION_MODE: "local"
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY is required}
      DATABASE_URL: "postgres://crawler:crawler_password@postgres:5432/crawler_db?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - crawler_network

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    container_name: search-service
    ports:
      - "8088:8088"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY is required}
      DATABASE_URL: "postgres://crawler:crawler_password@postgres:5432/crawler_db?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      - postgres
      - kafka
    networks:
      - crawler_network

  indexer-service:
    build:
      context: .
      dockerfile: indexer-service/Dockerfile
    container_name: indexer-service
    environment:
      KAFKA_BROKERS: "kafka:29092"
      DATABASE_URL: "postgres://crawler:crawler_password@postgres:5432/crawler_db?sslmode=disable"
    depends_on:
      - kafka
      - postgres
    networks:
      - crawler_network

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    environment:
      DATABASE_URL: "postgres://crawler:crawler_password@postgres:5432/crawler_db?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - crawler_network
    stdin_open: true
    tty: true

  gateway:
    image: caddy:2.7-alpine
    container_name: gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - agent-service
      - search-service
    networks:
      - crawler_network

volumes:
  kafka-data:
  redis-data:
  pg-data:
  prom-data:
  grafana-data:

networks:
  crawler_network:
    driver: bridge
